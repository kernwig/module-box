# Builds the plugin when a version tag (e.g. 1.0.1) is pushed and creates a
# draft GitHub release with the three files Obsidian downloads. Review the
# draft's notes on GitHub, then publish it.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # create the release
  id-token: write # sign the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No dependency cache: a release build with write permissions
          # shouldn't restore files from a cache, and npm ci is fast here.
          package-manager-cache: false

      - run: npm ci

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm run check

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css
